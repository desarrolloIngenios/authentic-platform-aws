apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "elearning.fullname" . }}-moodledata
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.moodledata.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.moodledata.size }}
